# The app as users get it: the installer built, the app run from outside the repository (where a missing package
# would show instead of being found in the repo's node_modules), through the memory smoke phase with dsh, its
# plugins and the fake model. daily.yml runs complete acceptance,
# and release.yml reuses these installers for publication.
name: package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      runKey:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.runKey || github.run_id }}
  cancel-in-progress: true

env:
  # Unsigned builds, as released. Publishing is release.yml's, not this workflow's.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:memory-plugin
      - run: npm run dist:mac
      - name: Smoke the app from the mounted dmg
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          volume=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | head -1)
          trap 'hdiutil detach "$volume" || true' EXIT
          VIVA_SMOKE_EXECUTABLE="$volume/Viva.app/Contents/MacOS/Viva" npm run smoke:package
      # What a release attaches: the installer and the notices for what it carries.
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/THIRD_PARTY_NOTICES-darwin.txt
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke
          path: |
            smoke/test-results
            smoke/report
            smoke/junit.xml

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:memory-plugin
      - name: Build the installer, install it silently, smoke it, uninstall
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-windows.ps1 -PackageOnly
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/THIRD_PARTY_NOTICES-win32.txt
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: |
            smoke/windows-report
            smoke/test-results
            smoke/report
            smoke/junit.xml
