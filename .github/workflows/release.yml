# A release, made by pushing its tag (v0.4.0-beta.1): the version in package.json checked against the tag, the
# complete source acceptance and installers verified on both systems, then the GitHub release made from them.
# A version with a dash is a beta and is marked as a pre-release. Nothing is published when a step before it fails.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag names the version in package.json and its notes are written
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          if [ ! -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            echo "::error::docs/releases/$GITHUB_REF_NAME.md is missing"
            exit 1
          fi

  full:
    needs: version
    uses: ./.github/workflows/full.yml

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      runKey: ${{ github.run_id }}

  publish:
    needs: [package, full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${tag} — $(echo "${tag#v}" | sed -E 's/-([a-z]+)\.([0-9]+)$/ \1 \2/')"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          ls -l assets
          gh release create "$tag" assets/* --verify-tag --title "$title" --notes-file "docs/releases/$tag.md" "${prerelease[@]}"
