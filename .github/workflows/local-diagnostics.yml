# Diagnostic fault acceptance is separate from the general smoke/test engineering lanes.
name: local diagnostics

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faults:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Process suspension, clear recovery, historical spans and real export
        run: npx cross-env ELECTRON_RUN_AS_NODE=1 electron --test test/diagnostics-process-pause.test.ts test/diagnostics-health.test.ts test/diagnostics-recovery.test.ts test/diagnostics-export.test.ts
      - name: Conversation replay, prompt settlement and effect retries
        run: npx cross-env ELECTRON_RUN_AS_NODE=1 electron --test test/renderer-initialization.test.ts test/acp-operations.test.ts test/effects.test.ts
      - run: npm run build
      - name: Owner deadline and isolated process recovery
        run: node scripts/smoke-memory-availability.ts
      - name: Frozen Backend and Renderer native export
        run: node scripts/smoke-local-diagnostics.ts
      - name: Heartbeat and coordinated clear recovery
        run: node scripts/smoke-diagnostic-controls.ts
      - name: Settings controls and privacy
        id: settings
        run: node scripts/smoke-diagnostics-settings.ts
      - name: Fixed-load default diagnostics latency gate
        run: npx cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/benchmark-memory-diagnostics.ts
      - name: Conversation, task, schedule and local retrieval latency
        if: ${{ !cancelled() && steps.settings.outcome == 'success' }}
        run: npx cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/benchmark-diagnostic-flows.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            smoke/l1b-availability
            smoke/l1c-controls
            smoke/l1c-export
            smoke/l3-settings
