# Complete validation on both shipping platforms. Each desktop runner owns one worker.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:i18n

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VIVA_SMOKE_RUN: ${{ matrix.os }}-core-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.VIVA_SMOKE_RUN }}
          path: |
            smoke/${{ env.VIVA_SMOKE_RUN }}/test-results
            smoke/${{ env.VIVA_SMOKE_RUN }}/report
            smoke/${{ env.VIVA_SMOKE_RUN }}/junit.xml

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        lane: [interaction, memory]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VIVA_SMOKE_LANE: ${{ matrix.lane }}
      VIVA_SMOKE_RUN: ${{ matrix.os }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test -c test/smoke/playwright.config.ts --project=integration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ env.VIVA_SMOKE_RUN }}
          path: |
            smoke/${{ env.VIVA_SMOKE_RUN }}/test-results
            smoke/${{ env.VIVA_SMOKE_RUN }}/report
            smoke/${{ env.VIVA_SMOKE_RUN }}/junit.xml

  # Preserve the existing "check (macos-latest)" / "check (windows-latest)" status names.
  # Matrix needs aggregate both OSes, so either platform failing closes both gates.
  check:
    if: always()
    needs: [headless, core, integration]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.CHECK_RESULTS)
            const required = ['headless', 'core', 'integration']
            const failed = required.filter(job => results[job]?.result !== 'success')
            if (failed.length) core.setFailed(`Required jobs did not succeed: ${failed.join(', ')}`)
