name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dist:mac
          - os: windows-latest
            package: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:pr
      - name: Cache verified embedding assets for packaging
        uses: actions/cache@v4
        with:
          path: build/memory-embedding/prepared
          key: embedding-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/memory-embedding/package*.json', 'build/memory-embedding/model-license.txt', 'scripts/*memory-embedding*.ts', 'src/memory/node/memory-embedding-assets.ts') }}
      - run: npm run ${{ matrix.package }}
