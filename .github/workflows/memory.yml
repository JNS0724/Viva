# Complete memory behavior on both shipping platforms; package-owned offline installation stays in package.yml.
name: memory

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:feature -- memory --level fast --level integration --level timing
