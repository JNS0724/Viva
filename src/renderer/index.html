<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: viva-image:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./island.css">
  <link rel="stylesheet" href="./personal.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="titlebar-left" id="titlebar-left"></div>
      <div class="titlebar-center" id="island"></div>
      <div class="titlebar-right">
        <button class="icon-btn" id="open-profile" type="button" aria-label="回顾、后台、关于你和设置" title="回顾 · 后台 · 关于你 · 设置" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        </button>
        <button class="icon-btn" id="toggle-drawer" type="button" aria-label="切换工具抽屉" title="工具抽屉" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <!-- 搜索 · 关于你 · 设置: one page over the conversation, under the title bar so the island stays in reach (view/hub.js). -->
      <section class="hub" id="hub" data-open="false" aria-label="搜索、关于你和设置">
        <nav class="hub-side" aria-label="页面">
          <button class="hub-back" id="hub-back" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
            返回<kbd>Esc</kbd>
          </button>
          <button class="hub-nav" type="button" data-page="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            回顾<kbd class="hub-key" id="hub-search-key">⌘F</kbd>
          </button>
          <button class="hub-nav" type="button" data-page="tasks">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9h10M7 13h6M7 17h8"></path></svg>
            后台
          </button>
          <button class="hub-nav" type="button" data-page="profile">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
            关于你
          </button>
          <button class="hub-nav" type="button" data-page="settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
            设置
          </button>
          <p class="hub-foot">助手在做的事照常进行，进展看标题栏上的岛。</p>
        </nav>
        <div class="hub-main">
          <!-- 回顾: search, or with nothing typed the timeline by day (view/history-panel.js, view/review.js). -->
          <section class="hub-page hub-search" data-page="search" aria-label="回顾" hidden>
            <label class="history-search">
              <span class="sr-only">搜索说过的话</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
              <input id="history-search" type="search" placeholder="搜索说过的话…" autocomplete="off" spellcheck="false">
            </label>
            <div class="history-list" id="history-list"></div>
          </section>
          <div class="hub-page" id="profile-root" data-page="profile" hidden></div>
          <div class="hub-page" id="settings-root" data-page="settings" hidden></div>
        </div>
      </section>
      <!-- 后台: every background task and the one picked, in the same place (view/tasks-page.js). -->
      <section class="hub tasks-page" id="tasks-page" data-open="false" aria-label="后台任务"></section>

      <main class="main" id="main">
        <!-- The column's edges: dragged to make it wider or narrower, double-clicked back (view/column-resize.ts). -->
        <div class="col-grip col-grip-left" id="col-grip-left" data-side="left" tabindex="0" role="separator" aria-orientation="vertical"
          aria-label="对话宽度：方向键调整，Home 恢复" aria-valuemin="560" title="拖动调整对话宽度，双击恢复"></div>
        <div class="col-grip col-grip-right" id="col-grip-right" data-side="right" tabindex="0" role="separator" aria-orientation="vertical"
          aria-label="对话宽度：方向键调整，Home 恢复" aria-valuemin="560" title="拖动调整对话宽度，双击恢复"></div>
        <!-- Background tasks in the corner, folded to a quiet tag when the user wants (view/task-dock.ts). -->
        <aside class="task-dock" id="task-dock" aria-label="后台任务" hidden></aside>
        <section class="scroll" id="scroll" aria-live="polite">
          <div class="home" id="home"></div>
          <div class="earlier" id="earlier" hidden></div>
          <div class="thread" id="thread" hidden></div>
          <button class="jump-latest" id="jump-latest" type="button" hidden>↓ 新内容</button>
        </section>
        <!-- 按轮次跳转: one mark per question (view/turn-rail.js). -->
        <nav class="turn-rail" id="turn-rail" aria-label="按轮次跳转" hidden></nav>

        <!-- 本话题 · N 条 · 已用 X%, and ＋ 新话题: what the assistant has in mind now (view/topic-label.js). -->
        <div class="ctx-area" id="ctx-area" hidden></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="composer-input">给助手发消息</label>
          <div class="route" id="route-hint" aria-live="polite" hidden></div>
          <div class="draft-pics-row" id="draft-pics" hidden></div>
          <textarea id="composer-input" rows="2" placeholder="让助手帮你做点什么…　Enter 发送 · Shift+Enter 换行"></textarea>
          <div class="composer-row">
            <div class="model-area" id="model-area">
              <button class="model-btn" id="model-btn" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
              <div id="model-menu"></div>
            </div>
            <div class="workdir-area">
              <button class="chip workdir-chip" id="composer-context" type="button" aria-haspopup="menu" aria-expanded="false"></button>
              <div id="workdir-menu"></div>
            </div>
            <!-- What the assistant may do without asking: 完全 / 自动 / 工作区修改 / 仅可查看 (view/permission-picker.js). -->
            <div class="perm-area" id="perm-area"></div>
            <button class="btn btn-secondary bg-send" id="bg-send" type="button" title="交给后台做，这里照常用">↗ 后台做</button>
            <button class="send-btn" id="send-btn" type="submit" aria-label="发送"></button>
          </div>
        </form>
        <p class="disclaimer">助手可能出错；哪些操作会先问你，看输入框里选的权限。</p>
      </main>

      <aside class="drawer" id="drawer" aria-label="工具抽屉" data-open="false"></aside>
    </div>
  </div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div id="workdir-confirm-root"></div>
  <div id="rewind-confirm-root"></div>
  <div id="resume-root"></div>
</body>
</html>
